[package]
name = "vietnamska-slovicka"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Učení vietnamských slovíček metodou kartiček s rozloženým opakováním"
publish = false

[dependencies]
anyhow = "=1.0.104"
time = { version = "=0.3.55", default-features = false, features = ["std", "macros", "formatting", "parsing"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
tracing-appender = "=0.2.5"
eframe = "=0.37.0"
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
toml = "=1.1.8"
